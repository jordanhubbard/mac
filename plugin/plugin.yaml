name: mac
version: 0.1.0
description: Hermes plugin exposing the mac task ledger as conversational tools.
author: mac
kind: standalone
requires_env:
  - MAC_URL
  - MAC_WORKER_TOKEN
  - MAC_HERMES_INSTANCE_ID
provides_tools:
  - mac_create_task
  - mac_list_tasks
  - mac_get_task
  - mac_task_summary
  - mac_cancel_task
  - mac_work_brief
  - mac_pending_notifications
  - mac_ack_notification
