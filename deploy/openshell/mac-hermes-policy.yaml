# OpenShell guardrail policy for the MAC / Hermes task executor.
#
# This file IS the guardrail specification. Because the agent runs `--yolo`
# (Hermes' own approval prompts are bypassed), OpenShell is the sole authority
# over what the agent may touch: filesystem (Landlock), syscalls (seccomp), and
# network egress (deny-by-default L7 proxy). Anything not allowed here is
# denied. Start tight; widen deliberately (each added rule is a guardrail hole).
#
# This is a TEMPLATE. Substitute the __PLACEHOLDER__ tokens for your fleet and
# adjust the filesystem paths to match how the Hermes runtime is made available
# inside the sandbox (a prebuilt image via `--from`, or `--upload`); see
# docs/openshell-sandbox.md. Apply with:
#   MAC_OPENSHELL_POLICY=/path/to/this.yaml MAC_OPENSHELL_SANDBOX=1
# (the executor passes it as `openshell sandbox create --policy ...`).

version: 1

filesystem_policy:
  # include_workdir auto-adds the task git worktree (the executor's cwd) to the
  # writable set — that is where the agent does its work and writes evidence.
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /lib64
    - /bin
    - /sbin
    - /etc
    - /proc
    - /var/log
    # The sandbox user's OWN HOME. This policy sets run_as_user: sandbox, so
    # bash starts with HOME=/home/sandbox and a login shell sources
    # ~/.profile before the task's first command. The path was in no granted
    # set, so Landlock denied the read and every command began with
    #     /bin/bash: /home/sandbox/.profile: Permission denied
    # after which the repository verifier exited non-zero and the gate
    # classified completed work as repository_test_failed.
    #
    # An earlier fix installed a readable .profile in the image. That could not
    # have worked: the file is already mode 0644, world-readable. The denial
    # was never about file permissions -- a path outside the granted set
    # returns EACCES, which bash reports identically.
    - /home/sandbox
    # The vendored Hermes runtime + venv. The renderer fills these from the
    # provisioning mode: host paths (~/.mac/venv, ~/.mac/src) by default, or the
    # in-image install path (e.g. /opt/mac-venv) when rendered with image_runtime.
    - __RUNTIME_VENV__
    - __RUNTIME_SRC__
  read_write:
    - /tmp
    # /dev as a directory (not the /dev/null leaf): under hard_requirement on
    # Landlock ABI >= 3 (kernel 6.x) a device FILE given a directory access
    # right (ReadDir) is rejected as "incompatible directory-only access-rights".
    # The directory satisfies ReadDir and covers /dev/null + /dev/urandom.
    - /dev
    # The agent's home cache/state (pip, git config, tool caches). Host mode ->
    # ~/.cache + ~/.config; image mode -> /tmp (the image bakes no per-user home,
    # and these would otherwise be nonexistent leaves that break hard_requirement,
    # which rejects a ReadDir right on a path it can't classify as a directory).
    - __CACHE_DIR__
    - __CONFIG_DIR__

landlock:
  # best_effort — REQUIRED here, not a relaxation: this policy declares
  # network_policies, and OpenShell's egress proxy adds a directory ReadDir
  # access-right on its own (non-directory) proxy path. Under hard_requirement,
  # Landlock ABI >= 3 (kernel 6.x) rejects that as "incompatible directory-only
  # access-rights" and the sandbox fails to start. best_effort skips ONLY that
  # one incompatible internal rule and still fully enforces every declared path
  # (validated: writes to read-only paths and reads of non-granted paths are
  # denied) plus deny-by-default network egress (the L7 proxy, independent of
  # Landlock). The one guarantee best_effort drops — aborting on a kernel with
  # NO Landlock at all — is recovered by the executor's _kernel_has_landlock()
  # precheck, which fails closed before launching. The deny-all bundled default
  # (no proxy) keeps hard_requirement.
  compatibility: best_effort

process:
  # Never root. The supervisor drops privileges to this identity.
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  # --- MAC control-plane / AgentBus: authoritative task and peer transport ---
  mac_hub:
    name: mac-hub
    endpoints:
      - host: __MAC_HUB_HOST__      # e.g. 100.125.137.89
        port: __MAC_HUB_PORT__      # e.g. 8789
        # protocol: rest enables L7 inspection; omit for a raw TCP tunnel.
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - { path: __RUNTIME_PY__ }

  # --- Model gateway: the agent's LLM calls. Scope to YOUR gateway host. ---
  model_gateway:
    name: model-gateway
    endpoints:
      - host: __MODEL_GATEWAY_HOST__   # e.g. your azure/anthropic gateway
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - { path: __RUNTIME_PY__ }

  # --- Codex CLI provider egress for repository-editing tasks. ---
  # The CLI is a Node program. Both the symlink launcher and node itself are
  # listed so policy enforcement remains correct regardless of exec handoff.
  codex_provider:
    name: codex-provider
    endpoints:
      - host: chatgpt.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: chat.openai.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: auth.openai.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: api.openai.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - { path: /usr/local/bin/codex }
      - { path: /usr/bin/node }

  # --- Claude Code provider egress for repository-editing tasks. ---
  # Claude is a reviewed native CLI in this image.  List both the stable PATH
  # entry and its pinned resolved executable so OpenShell can attribute the
  # socket after symlink resolution.
  claude_provider:
    name: claude-provider
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      # NOT added, deliberately: NVIDIA's pi policy allows claude.ai and
      # platform.claude.com. Those serve the BROWSER OAuth login, which a
      # headless sandbox cannot perform; mac's claude route authenticates from
      # ANTHROPIC_API_KEY or ~/.claude/.credentials.json, and both talk to
      # api.anthropic.com. Adding them would widen a deny-by-default boundary
      # for a flow that cannot happen here. test_real_operator_template_renders
      # pins this host set precisely so that stays a decision.
    binaries:
      - { path: /usr/local/bin/claude }
      - { path: /usr/local/lib/claude-code/versions/2.1.220/claude }

  # --- Cursor Agent provider egress for repository-editing tasks. ---
  # Cursor's agent transport uses streaming connections to its own backend.
  # Scope raw TLS to the reviewed CLI's documented service hosts instead of
  # forcing those streams through REST inspection.  The versioned Node path is
  # intentional: cursor-agent resolves its launcher symlink and execs that
  # bundled runtime.  tests/test_openshell_policy.py binds these paths to the
  # pinned Containerfile versions so a CLI upgrade cannot silently drift.
  cursor_provider:
    name: cursor-provider
    endpoints:
      - { host: api2.cursor.sh, port: 443 }
      - { host: api3.cursor.sh, port: 443 }
      - { host: api4.cursor.sh, port: 443 }
      # Cursor fetches a region-specific agent URL from api2 at runtime (for
      # example agentn.us.api5.cursor.sh). OpenShell's ** DNS glob covers one
      # or more leading labels while remaining scoped to Cursor's api5 zone.
      # The agent stream negotiates HTTP/2; `tls: skip` disables OpenShell's
      # HTTP/1-oriented TLS auto-detection and keeps this endpoint as the raw
      # TCP passthrough declared by the omitted protocol field.
      - { host: "**.api5.cursor.sh", port: 443, tls: skip }
      - { host: repo42.cursor.sh, port: 443 }
      - { host: authenticator.cursor.sh, port: 443 }
      - { host: prod.authentication.cursor.sh, port: 443 }
      - { host: api.cursor.com, port: 443 }
    binaries:
      - { path: /usr/local/bin/cursor-agent }
      - { path: /usr/local/lib/cursor-agent/versions/2026.07.23-e383d2b/node }

  # --- opencode provider egress for repository-editing tasks. ---
  # opencode is a multi-provider client: the provider is chosen per model in
  # ~/.config/opencode/opencode.json, so unlike claude/codex/cursor there is no
  # single vendor host implied by the CLI itself. This fleet's opencode config
  # authenticates to the NVIDIA inference API, so that is what is allowed here.
  # Changing the configured provider therefore requires changing this block --
  # deliberately, because silently following a config file into an unreviewed
  # endpoint is the thing the deny-by-default proxy exists to prevent.
  #
  # The binary is npm-installed and reached through a symlink, so both the PATH
  # entry and the resolved target are listed for socket attribution after
  # symlink resolution, matching the claude/cursor blocks. The `.exe` suffix is
  # upstream's naming on every platform, not a Windows artefact.
  opencode_provider:
    name: opencode-provider
    endpoints:
      - host: inference-api.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      # opencode's OWN model catalog (`opencode/*` in `opencode models`, e.g.
      # opencode/big-pickle, opencode/nemotron-3-ultra-free) is served by
      # opencode.ai, not by whatever provider the config names. Pinning one of
      # those models with only the configured provider allowed would fail at
      # the proxy, not at selection -- and the CLI also reaches here for
      # autoupdate, which its config enables by default.
      - host: opencode.ai
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - { path: /usr/local/bin/opencode }
      - { path: /usr/local/lib/node_modules/opencode-ai/bin/opencode.exe }

  # --- pi provider egress for repository-editing tasks. ---
  # pi is multi-provider like opencode: it picks a provider per model from its
  # own catalog, so no vendor host is implied by the CLI itself. Scoped to the
  # NVIDIA inference endpoint, which is what this fleet's other multi-provider
  # route already uses and what NVIDIA's own pi profile configures
  # (horde-next-ops packages/openshell-worker/assets). Pointing pi at a
  # different provider requires changing this block, deliberately.
  #
  # pi is a NODE script (bin/pi -> dist/cli.js), so node is what actually opens
  # the socket -- both are listed, exactly as cursor_provider lists its bundled
  # runtime. Without the node paths the proxy cannot attribute the connection
  # and the route is denied with no obvious cause.
  pi_provider:
    name: pi-provider
    endpoints:
      - host: inference-api.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - { path: /usr/local/bin/pi }
      - { path: /usr/local/lib/node_modules/@earendil-works/pi-coding-agent/dist/cli.js }
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }

  # --- Git over HTTPS for task results (push branches / read repos). ---
  # If you push over SSH instead, model that as a raw TCP endpoint on port 22
  # to your git host rather than this REST block.
  github:
    name: github
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: cli.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: objects.githubusercontent.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: github-releases.githubusercontent.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: release-assets.githubusercontent.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - { path: /usr/bin/git }
      - { path: /usr/bin/gh }
      # The pinned mac-hermes image installs GitHub CLI here. Keep /usr/bin/gh
      # for distro-packaged host/runtime variants.
      - { path: /usr/local/bin/gh }
      - { path: /usr/lib/git-core/git-remote-https }
      - { path: /usr/bin/curl }

  # --- Node / pnpm package installs for repository bootstrap. ---
  # TypeScript/Node repos run `pnpm install` (or npm/yarn) before their tests,
  # which fetch from the npm registry. Without this block every Node install is
  # denied by the deny-by-default proxy and `make test` can never bootstrap.
  # The socket-opening process for an npm/pnpm fetch is `node`, so the registry
  # is paired with the system node binaries (+ the npm/npx/corepack wrappers).
  #
  # Scope note: registry.npmjs.org ONLY — deliberately NOT nodejs.org. The image
  # ships pinned Node 22.23.1 and pnpm 11.13.1 and runs pnpm under the *system*
  # node at the known /usr/bin/node path, so no Node tarball download
  # (nodejs.org) and no dynamic per-task toolchain-node path need to be
  # allowlisted. If a repo ever genuinely requires another Node, install it to a
  # FIXED, allowlisted path and add that path here rather than opening nodejs.org
  # plus a writable /tmp binary.
  node_packages:
    name: node-packages
    endpoints:
      - host: registry.npmjs.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      # node-gyp downloads the Node headers tarball from nodejs.org to compile
      # native modules (e.g. @vscode/sqlite3's `node-gyp rebuild`). Without it the
      # build fails "403 downloading .../node-vXX-headers.tar.gz". The fetch is
      # done by `node` (node-gyp.js), already listed below. Read-only.
      - host: nodejs.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - { path: /usr/bin/node }
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/npm }
      - { path: /usr/local/bin/npm }
      - { path: /usr/bin/npx }
      - { path: /usr/local/bin/npx }
      - { path: /usr/bin/corepack }
      - { path: /usr/local/bin/corepack }

  # --- Per-repo external APIs are NOT declared here (ADR 0009 §2a). ---
  # This block used to carry the aviation suite's data sources
  # (opensky-network.org, aviationweather.gov, tfr.faa.gov) fleet-wide, which
  # meant every sandbox in the fleet -- including repos with no business
  # reaching them -- carried that egress. That accumulation is exactly what
  # ADR 0009 set out to stop, and removing it is where the reduction is
  # actually collected.
  #
  # Declare a project's hosts against the PROJECT instead:
  #     mac project egress grant <project> <host> --reason "..."
  # The hub projects them onto each assignment at claim time (see
  # ControlPlane._project_declared_egress), so they reach existing tasks too,
  # and they are granted read-only at the hub_declared tier. A task's own
  # metadata.egress_contract is stripped from the assignment: these are
  # operator policy, not a task author's request.
  #
  # Requires MAC_OPENSHELL_TASK_EGRESS=1 on the worker. See
  # docs/openshell-sandbox.md.

  # --- Python package installs for repository bootstrap. ---
  # Repository contracts may legitimately create task-local virtualenvs and run
  # `pip install -e .[dev]` before tests. Keep this read-only and scoped to the
  # Python package index hosts needed by pip's default resolver.
  python_packages:
    name: python-packages
    endpoints:
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: files.pythonhosted.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - { path: /usr/local/bin/python3 }
      - { path: /usr/local/bin/python }
      - { path: /usr/bin/python3 }
      - { path: __RUNTIME_PY__ }
