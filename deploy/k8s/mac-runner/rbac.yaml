# Permissions for mac-k8s-orchestrator: create task/review Jobs, reconcile
# stuck Jobs, and optionally scale worker Deployments in the `mac` namespace.
# Nothing is cluster-wide; isolate tenants/roles with a namespace per
# orchestrator if you need stronger separation later.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mac-k8s-orchestrator
  namespace: mac
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mac-k8s-orchestrator
  namespace: mac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mac-k8s-orchestrator
subjects:
  - kind: ServiceAccount
    name: mac-k8s-orchestrator
    namespace: mac
