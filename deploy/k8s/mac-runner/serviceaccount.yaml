apiVersion: v1
kind: ServiceAccount
metadata:
  name: mac-k8s-runner
  namespace: mac
  labels:
    app.kubernetes.io/name: mac-k8s-runner
    app.kubernetes.io/component: runner
---
# The ServiceAccount that task Jobs run AS. Intentionally distinct
# from the runner's SA so its permissions stay null — task Jobs do
# NOT need K8s API access. They authenticate to mac-api via the
# MAC_WORKER_TOKEN env var injected from a Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mac-task-runner
  namespace: mac
  labels:
    app.kubernetes.io/name: mac-task-runner
    app.kubernetes.io/component: task-executor
automountServiceAccountToken: false
