apiVersion: apps/v1
kind: Deployment
metadata:
  name: mac-k8s-orchestrator
  namespace: mac
  labels:
    app.kubernetes.io/name: mac-k8s-orchestrator
    app.kubernetes.io/component: orchestrator
spec:
  # Multi-replica is safe: both pods are replicas of ONE logical dispatcher
  # identity (mac-k8s-orchestrator), authenticated by its exact agent-bound
  # credential. claim-next is atomic at the database layer
  # (uniq_leases_active_per_task partial unique index). Two runners
  # racing for the same task is a no-op.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: mac-k8s-orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mac-k8s-orchestrator
        app.kubernetes.io/component: orchestrator
    spec:
      serviceAccountName: mac-k8s-orchestrator
      automountServiceAccountToken: true   # needed for in-cluster K8s API
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mac-k8s-orchestrator
          # Same mac image as mac-api; selection is via console-script.
          image: ghcr.io/anthropics/mac:CHANGE-ME@sha256:CHANGE-ME
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/mac-crash-observer
            - --supervisor
            - kubernetes
            - --
            - mac-k8s-orchestrator
          env:
            - name: MAC_URL
              value: "http://mac-api.mac.svc:80"
            - name: MAC_CRASH_SPOOL_DIR
              value: "/var/lib/mac/crash-spool"
            - name: PYTHONFAULTHANDLER
              value: "1"
            - name: MAC_AGENT_ID
              value: "mac-k8s-orchestrator"
            - name: MAC_RUNNER_NAMESPACE
              value: "mac"
            - name: MAC_RUNNER_TASK_SERVICE_ACCOUNT
              value: "mac-task-runner"
            - name: MAC_RUNNER_DEFAULT_IMAGE
              value: "ghcr.io/anthropics/mac:CHANGE-ME@sha256:CHANGE-ME"
            - name: MAC_RUNNER_POLL_INTERVAL_SECONDS
              value: "5"
            - name: MAC_RUNNER_ACTIVE_DEADLINE_SECONDS
              value: "1800"
            - name: MAC_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  # Generated/applied by `python -m mac.worker_credentials`.
                  # This Secret is bound only to MAC_AGENT_ID above; it is not
                  # the hub admin Secret and must not be reused by role workers.
                  name: mac-worker-mac-k8s-orchestrator-cf67fc64
                  key: MAC_WORKER_TOKEN
            - name: MAC_WORKER_CREDENTIAL_ID
              valueFrom:
                secretKeyRef:
                  name: mac-worker-mac-k8s-orchestrator-cf67fc64
                  key: MAC_WORKER_CREDENTIAL_ID
            - name: MAC_WORKER_CREDENTIAL_VERSION
              valueFrom:
                secretKeyRef:
                  name: mac-worker-mac-k8s-orchestrator-cf67fc64
                  key: MAC_WORKER_CREDENTIAL_VERSION
            - name: MAC_WORKER_CREDENTIAL_AGENT_ID
              valueFrom:
                secretKeyRef:
                  name: mac-worker-mac-k8s-orchestrator-cf67fc64
                  key: MAC_WORKER_CREDENTIAL_AGENT_ID
            - name: MAC_WORKER_CREDENTIAL_FINGERPRINT
              valueFrom:
                secretKeyRef:
                  name: mac-worker-mac-k8s-orchestrator-cf67fc64
                  key: MAC_WORKER_CREDENTIAL_FINGERPRINT
            - name: MAC_WORKER_CREDENTIAL_SOURCE_COMMIT
              valueFrom:
                secretKeyRef:
                  name: mac-worker-mac-k8s-orchestrator-cf67fc64
                  key: MAC_WORKER_CREDENTIAL_SOURCE_COMMIT
            - name: MAC_WORKER_CREDENTIAL_RUNTIME_DIGEST
              valueFrom:
                secretKeyRef:
                  name: mac-worker-mac-k8s-orchestrator-cf67fc64
                  key: MAC_WORKER_CREDENTIAL_RUNTIME_DIGEST
            - name: MAC_WORKER_RUNNING_DIGEST
              valueFrom:
                secretKeyRef:
                  name: mac-worker-mac-k8s-orchestrator-cf67fc64
                  key: MAC_WORKER_RUNNING_DIGEST
            - name: MAC_WORKER_IDENTITY_MODE
              value: "bound"
            # Exact ordinary-task/reviewer agent -> Secret names. Package tasks
            # retain the dispatcher identity because their immutable assignment
            # was created for that exact claimant; they use the dispatcher Secret
            # above even when a role-specific image/executor is selected. An
            # absent role mapping deliberately stays on the compatibility path.
            - name: MAC_RUNNER_AGENT_TOKEN_SECRETS
              value: '{"mac-k8s-orchestrator":"mac-worker-mac-k8s-orchestrator-cf67fc64"}'
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command: ["pgrep", "-f", "mac-k8s-orchestrator"]
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: crash-spool
              mountPath: /var/lib/mac/crash-spool
      volumes:
        - name: tmp
          emptyDir: {}
        - name: crash-spool
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mac-k8s-orchestrator
