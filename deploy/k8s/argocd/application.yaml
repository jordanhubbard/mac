# ArgoCD Application for the mac K8s topology.
#
# Two apps in a single file (separated by ---): one for the CNPG cluster,
# one for the mac-api Deployment + Service. They live in the same target
# namespace but are deployed independently so the database can be
# bootstrapped before the application replicas spin up.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mac-cnpg
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Replace with the URL of the repo that holds these manifests after
    # forking. Path is stable.
    repoURL: https://github.com/CHANGE-ME/mac.git
    targetRevision: main
    path: deploy/k8s/cnpg
  destination:
    server: https://kubernetes.default.svc
    namespace: mac
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mac-api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/CHANGE-ME/mac.git
    targetRevision: main
    path: deploy/k8s/mac-api
  destination:
    server: https://kubernetes.default.svc
    namespace: mac
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mac-k8s-runner
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/CHANGE-ME/mac.git
    targetRevision: main
    path: deploy/k8s/mac-runner
  destination:
    server: https://kubernetes.default.svc
    namespace: mac
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mac-k8s-controller
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/CHANGE-ME/mac.git
    targetRevision: main
    path: deploy/k8s/mac-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: mac
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
