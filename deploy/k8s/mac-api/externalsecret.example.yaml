# Example: ExternalSecret resources that synthesise the two Secrets
# `mac-api/deployment.yaml` reads from. Adapt to whichever
# ExternalSecrets backend your cluster uses (Vault, AWS Secrets Manager,
# 1Password, etc.) — this file demonstrates SecretStore wiring; the
# remoteRef keys must match the names you keep in your secret backend.
#
# Apply via your normal ExternalSecrets flow; do NOT commit real secret
# material. The two Secrets produced are:
#
#   mac-pg-app:
#     uri:       postgresql://mac:<password>@mac-pg-rw.mac.svc/mac
#     username:  mac
#     password:  <password>
#
#   mac-api-config:
#     MAC_SECRET_KEY:  <32+ char HKDF-input>
#     MAC_API_TOKENS:  '{"<token>": ["admin"]}'
#
# CNPG also creates `mac-pg-app` automatically from the bootstrap config,
# so for the cluster credential the ExternalSecret is OPTIONAL — only
# include it if you want ESO to be the source of truth (rotate from
# Vault) rather than CNPG self-managing.

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mac-api-config
  namespace: mac
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: mac-api-config
    creationPolicy: Owner
  data:
    - secretKey: MAC_SECRET_KEY
      remoteRef:
        key: mac/api
        property: secret_key
    - secretKey: MAC_API_TOKENS
      remoteRef:
        key: mac/api
        property: tokens_json
