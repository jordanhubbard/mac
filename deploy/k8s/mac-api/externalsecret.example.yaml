# Example: ExternalSecret that synthesises the single `mac-api-config`
# Secret consumed by mac-api, mac-k8s-runner, and mac-k8s-controller.
# Adapt to whichever ExternalSecrets backend your cluster uses (Vault,
# AWS Secrets Manager, 1Password, etc.) — this file demonstrates
# SecretStore wiring; the remoteRef keys must match the names you keep
# in your secret backend.
#
# Apply via your normal ExternalSecrets flow; do NOT commit real
# secret material. The resulting `mac-api-config` Secret must carry:
#
#   MAC_DATABASE_URL: postgresql://<user>:<pwd>@<host>:5432/<db>
#   MAC_SECRET_KEY:   <32+ char HKDF-input>
#   MAC_WORKER_TOKEN: <bearer token used by runner + task-runner>
#   MAC_API_TOKENS:   '{"<token>": ["admin"]}'   # optional

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mac-api-config
  namespace: mac
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: mac-api-config
    creationPolicy: Owner
  data:
    - secretKey: MAC_DATABASE_URL
      remoteRef:
        key: mac/api
        property: database_url
    - secretKey: MAC_SECRET_KEY
      remoteRef:
        key: mac/api
        property: secret_key
    - secretKey: MAC_WORKER_TOKEN
      remoteRef:
        key: mac/api
        property: worker_token
    - secretKey: MAC_API_TOKENS
      remoteRef:
        key: mac/api
        property: tokens_json
