apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mac
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  # ExternalSecret is environment-specific — copy and customise per env
  # (see externalsecret.example.yaml). It is not in this kustomization so
  # `kubectl kustomize` produces a working base without secrets.
