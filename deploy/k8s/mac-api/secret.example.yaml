# Example: the operator-supplied `mac-api-config` Secret consumed by mac-api
# and by ordinary task Jobs that still use the explicit compatibility path.
# The orchestrator Deployment uses a separate exact per-agent Secret.
#
# Copy this file, fill in the placeholder values, and apply with:
#
#   kubectl apply -f /path/to/your-mac-api-config.yaml
#
# DO NOT commit the filled-in copy. Either keep it out-of-tree, manage
# the Secret via your preferred secret-store (Vault, SOPS, ESO, Sealed
# Secrets, etc.), or generate it imperatively:
#
#   kubectl create namespace mac
#   BOOTSTRAP_TOKEN="$(openssl rand -hex 32)"
#   kubectl -n mac create secret generic mac-api-config \
#     --from-literal=MAC_DATABASE_URL='postgresql://user:pass@host:5432/mac' \
#     --from-literal=MAC_SECRET_KEY="$(openssl rand -base64 48)" \
#     --from-literal=MAC_WORKER_TOKEN="$BOOTSTRAP_TOKEN" \
#     --from-literal=MAC_API_TOKENS="{\"$BOOTSTRAP_TOKEN\":[\"agent\",\"dispatch\",\"read\",\"write\"]}"
#
# Required keys:
#   MAC_DATABASE_URL  postgresql://<user>:<pwd>@<host>:5432/<db>
#   MAC_SECRET_KEY    32+ char HKDF input for the Fernet secret-encryption key
#   MAC_WORKER_TOKEN  compatibility bootstrap/fallback token for registration
#                     and ordinary tasks only; never use it for package work
#   MAC_API_TOKENS    JSON map that registers the same bootstrap token with
#                     non-admin worker scopes. Exact per-agent Secrets replace
#                     it before the orchestrator Deployment starts.

apiVersion: v1
kind: Secret
metadata:
  name: mac-api-config
  namespace: mac
type: Opaque
stringData:
  MAC_DATABASE_URL: "postgresql://REPLACE_USER:REPLACE_PASSWORD@REPLACE_HOST:5432/mac"
  MAC_SECRET_KEY: "REPLACE_WITH_32+_CHAR_SECRET"
  MAC_WORKER_TOKEN: "REPLACE_WITH_BOOTSTRAP_BEARER_TOKEN"
  MAC_API_TOKENS: '{"REPLACE_WITH_BOOTSTRAP_BEARER_TOKEN":["agent","dispatch","read","write"]}'
