# Permissions for mac-k8s-controller (Phase 5):
#   - list/watch/delete batch/v1 Jobs   (reconcile stuck Jobs)
#   - read/scale apps/v1 Deployments    (provisioning-request fan-out)
# Scoped to the `mac` namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mac-k8s-controller
  namespace: mac
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mac-k8s-controller
  namespace: mac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mac-k8s-controller
subjects:
  - kind: ServiceAccount
    name: mac-k8s-controller
    namespace: mac
