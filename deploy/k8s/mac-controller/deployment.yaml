apiVersion: apps/v1
kind: Deployment
metadata:
  name: mac-k8s-controller
  namespace: mac
  labels:
    app.kubernetes.io/name: mac-k8s-controller
    app.kubernetes.io/component: controller
spec:
  # Controller is a singleton — only one reconciliation loop should run
  # at a time. Use a leader election layer if/when that becomes a
  # liveness concern; for now we keep replicas=1 and rely on K8s
  # to restart on crash.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mac-k8s-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mac-k8s-controller
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: mac-k8s-controller
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mac-k8s-controller
          image: ghcr.io/anthropics/mac:CHANGE-ME@sha256:CHANGE-ME
          imagePullPolicy: IfNotPresent
          command: ["mac-k8s-controller"]
          env:
            - name: MAC_URL
              value: "http://mac-api.mac.svc:80"
            - name: MAC_RUNNER_NAMESPACE
              value: "mac"
            - name: MAC_CONTROLLER_INTERVAL_SECONDS
              value: "30"
            # Scaler off by default — operators opt in once they have
            # mac-worker-<role-slug> Deployments named per the
            # K8sDeploymentScaler convention.
            - name: MAC_CONTROLLER_SCALER_ENABLED
              value: "0"
            - name: MAC_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mac-api-config
                  key: MAC_WORKER_TOKEN
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            exec:
              command: ["pgrep", "-f", "mac-k8s-controller"]
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
