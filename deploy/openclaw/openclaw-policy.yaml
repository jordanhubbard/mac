# MAC-authored OpenShell policy for the stock OpenClaw chat gateway.
#
# Derived from the Apache-2.0 NemoClaw OpenClaw and Slack policies, then reduced
# to MAC's actual gateway contract: one MAC router plus Slack Socket Mode.  The
# installer renders the two router placeholders before assigning this policy.
version: 1

filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /lib
    - /lib64
    - /bin
    - /sbin
    - /etc
    - /proc
    - /app
    - /opt
  read_write:
    - /tmp
    - /dev
    # The agent's home is writable so it can build a real dev environment as
    # the (non-root) sandbox user: pip --user into ~/.local, virtualenvs, and
    # git checkouts. OpenShell forbids container root, so system-wide installs
    # (apt, /usr) are not available; user-scoped Python/venv installs and
    # source builds are the supported path, paired with the curated
    # package-repo egress below.
    - /home/sandbox
    # OpenShell uploads MAC's owner-only managed config into this directory
    # before launching the gateway.  Marking it read-only prevents the trusted
    # upload itself; OpenClaw already needs read access to the credentials, and
    # network egress remains constrained by the deny-by-default proxy policy.
    - /home/sandbox/.config/mac-openclaw
    # State and workspace live under OpenShell's transferable /sandbox root.
    # The service wrapper checkpoints both trees before recreating a sandbox.
    - /sandbox

landlock:
  # MAC independently checks for a usable OpenShell enforcement boundary.  The
  # gateway's L7 deny-by-default proxy remains active when Landlock must skip an
  # incompatible internal path rule on a particular kernel.
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  mac_router:
    name: mac-router
    endpoints:
      - host: __MAC_ROUTER_HOST__
        port: __MAC_ROUTER_PORT__
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
          - allow: { method: PUT, path: "/**" }
          - allow: { method: PATCH, path: "/**" }
          - allow: { method: DELETE, path: "/**" }
      # When the hub is LOCAL to the gateway host (e.g. Rocky on the hub node),
      # the installer's rewrite_sandbox_local_url maps the loopback hub URL to
      # OpenShell's host-bridge alias `host.openshell.internal` — the only way a
      # sandbox can reach a host-local service. Without this endpoint the L7
      # proxy denies node's egress to that alias ("Request was cancelled"),
      # silently breaking the mac-continuity peer bridge (and everything else
      # the plugin fetches from the hub) on the hub-local gateway. The remote
      # gateways use __MAC_ROUTER_HOST__ above and are unaffected; allowing the
      # alias here fixes the local one without widening egress (same host:port).
      - host: host.openshell.internal
        port: __MAC_ROUTER_PORT__
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
          - allow: { method: PUT, path: "/**" }
          - allow: { method: PATCH, path: "/**" }
          - allow: { method: DELETE, path: "/**" }
    binaries:
      - { path: /usr/local/bin/openclaw }
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }

  # AgentFS v2: the shared fleet filesystem (hub WebDAV on port 8788, same
  # host as the router). curl/python/node reach it for GET (read) and PUT
  # (write, bearer-token-gated by the server). This is the sandbox-era
  # replacement for the old SMB share — HTTP, no mount, no CAP_SYS_ADMIN.
  mac_agentfs:
    name: mac-agentfs
    endpoints:
      - host: __MAC_ROUTER_HOST__
        port: 8788
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/agentfs/**" }
          - allow: { method: HEAD, path: "/agentfs/**" }
          - allow: { method: PUT, path: "/agentfs/**" }
          - allow: { method: DELETE, path: "/agentfs/**" }
      - host: host.openshell.internal
        port: 8788
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/agentfs/**" }
          - allow: { method: HEAD, path: "/agentfs/**" }
          - allow: { method: PUT, path: "/agentfs/**" }
          - allow: { method: DELETE, path: "/agentfs/**" }
    binaries:
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }
      - { path: /usr/bin/curl }
      - { path: /usr/bin/python3 }

  slack:
    name: slack
    endpoints:
      - host: slack.com
        port: 443
        protocol: rest
        enforcement: enforce
        request_body_credential_rewrite: true
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: api.slack.com
        port: 443
        protocol: rest
        enforcement: enforce
        request_body_credential_rewrite: true
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: hooks.slack.com
        port: 443
        protocol: rest
        enforcement: enforce
        request_body_credential_rewrite: true
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: wss-primary.slack.com
        port: 443
        protocol: websocket
        enforcement: enforce
        websocket_credential_rewrite: true
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: WEBSOCKET_TEXT, path: "/**" }
      - host: wss-backup.slack.com
        port: 443
        protocol: websocket
        enforcement: enforce
        websocket_credential_rewrite: true
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: WEBSOCKET_TEXT, path: "/**" }
    binaries:
      - { path: /usr/local/bin/openclaw }
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }

  telegram:
    name: telegram
    endpoints:
      - host: api.telegram.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/bot*/**" }
          - allow: { method: POST, path: "/bot*/**" }
          - allow: { method: GET, path: "/file/bot*/**" }
    binaries:
      - { path: /usr/local/bin/openclaw }
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }

  # Curated developer package repositories. The agent may install Python
  # packages (pip), pull source (git), and fetch NVIDIA/PyTorch wheels so it
  # can actually code — while the deny-by-default guard still blocks egress to
  # any host NOT on this list, preserving the exfiltration boundary. No
  # `binaries:` restriction here on purpose: any tool the agent uses (pip run
  # from a venv, curl, git, wget) may reach these repos, but only these repos.
  dev_repos:
    name: dev-repos
    endpoints:
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules: [ { allow: { method: GET, path: "/**" } }, { allow: { method: POST, path: "/**" } } ]
      - host: files.pythonhosted.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules: [ { allow: { method: GET, path: "/**" } } ]
      - host: bootstrap.pypa.io
        port: 443
        protocol: rest
        enforcement: enforce
        rules: [ { allow: { method: GET, path: "/**" } } ]
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules: [ { allow: { method: GET, path: "/**" } }, { allow: { method: POST, path: "/**" } } ]
      - host: codeload.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules: [ { allow: { method: GET, path: "/**" } } ]
      - host: objects.githubusercontent.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules: [ { allow: { method: GET, path: "/**" } } ]
      - host: raw.githubusercontent.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules: [ { allow: { method: GET, path: "/**" } } ]
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules: [ { allow: { method: GET, path: "/**" } }, { allow: { method: POST, path: "/**" } } ]
      - host: download.pytorch.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules: [ { allow: { method: GET, path: "/**" } } ]
      - host: developer.download.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules: [ { allow: { method: GET, path: "/**" } } ]
    # OpenShell's L7 proxy is per-binary: only listed binaries may reach the
    # hosts above. Cover the tools an agent installs/builds with — pip runs as
    # python3, git fetches via its remote-https helper — so `pip install`,
    # `git clone`, and curl/wget all reach the curated repos (verified: pypi
    # returns 200 with this list, and any host NOT above stays blocked).
    binaries:
      - { path: /usr/bin/python3 }
      - { path: /usr/bin/python3.11 }
      - { path: /usr/bin/python3.12 }
      - { path: /usr/bin/pip3 }
      - { path: /usr/bin/curl }
      - { path: /usr/bin/wget }
      - { path: /usr/bin/git }
      - { path: /usr/lib/git-core/git-remote-https }
      - { path: /usr/lib/git-core/git-remote-http }
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }
