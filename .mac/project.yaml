schema: mac.repository_contract.v1
project: mac
canonical_remote_url: git@github.com:jordanhubbard/mac.git
# Work-package certification/landing is intentionally not activated by a
# placeholder. Add the atomic `landing_certification_policy_id` plus
# `work_package_certification` extension only after provisioning the pinned
# image and exact policy described in docs/work-package-pipeline-activation.md.
platforms:
  - darwin
  - linux
  - wsl2
toolchain:
  required_commands:
    - python3
    - git
    - gh
bootstrap:
  command: python3 scripts/bootstrap-project.py
  creates:
    - .venv/bin/python
    - .venv/bin/pytest
    - .venv/bin/coverage
test:
  command: scripts/run-contract-tests.sh
evidence:
  required:
    - repo.head_sha
    - repo.pushed
    - repo.dirty
    - repo.files_changed
    - tests
