schema: mac.repository_contract.v1
project: mac
canonical_remote_url: git@github.com:jordanhubbard/mac.git
default_branch: main
platforms:
  - darwin
  - linux
  - wsl2
toolchain:
  required_commands:
    - python3
    - git
    - gh
    # The suite runs against PostgreSQL because the fleet does, and
    # scripts/run-contract-tests.sh fails fast without MAC_TEST_PG_URL rather
    # than skipping. Undeclared, the derived sandbox BOM could not know the
    # repository needs it, so the image shipped without it and EVERY code task
    # failed verification with "repository verifier exited with status 1" --
    # after doing its work correctly. Proven 2026-08-12 by driving one through.
    - initdb
    - pg_ctl
    - postgres
  # Minimum versions for commands whose FLOOR is load-bearing, not just their
  # presence. The merge-gate suite and the production merge queue both call
  # `git merge-tree --write-tree`, which only exists in git >= 2.38; on Ubuntu
  # 22.04 distro git (2.34.1) the merge-queue/publication tests fail with an
  # opaque rc=129 and a whole authoritative gate run is burned on a misleading
  # generic failure. scripts/run-contract-tests.sh fails fast on an older git,
  # but that is a runner-side backstop -- this floor is where the requirement is
  # DECLARED so every provisioning asset that installs git can be checked
  # against it (see tests/test_git_toolchain_floor.py). Format: `command: X.Y`.
  command_minimum_versions:
    git: "2.38"
bootstrap:
  command: python3 scripts/bootstrap-project.py
  creates:
    - .venv/bin/python
    - .venv/bin/pytest
    - .venv/bin/coverage
test:
  command: scripts/run-contract-tests.sh
evidence:
  required:
    - repo.head_sha
    - repo.pushed
    - repo.dirty
    - repo.files_changed
    - tests
