schema: mac.repository_contract.v1
project: mac
canonical_remote_url: git@github.com:jordanhubbard/mac.git
default_branch: main
landing_certification_policy_id: mac-work-package-v1
work_package_certification:
  schema: mac.work_package.certification_contract.v2
  policy:
    policy_id: mac-work-package-v1
    version: 1
    checksum: sha256:91a8e74ec7cb73e8cd2e710c6c1312284816d46da3cd6ecb2ef235a05ac69977
  policy_text: |
    # OpenShell FAIL-CLOSED default policy for MAC / Hermes (bundled fallback).
    #
    # The task executor passes THIS policy to `openshell sandbox create` whenever
    # MAC_OPENSHELL_SANDBOX is enabled but no policy is configured (no
    # MAC_OPENSHELL_POLICY and no ~/.mac/openshell-policy.yaml). Its sole purpose is
    # to guarantee that enabling sandboxing can NEVER silently fall back to
    # OpenShell's own image-default profile — a known, reviewed policy is always
    # applied.
    #
    # It is deliberately a LOCKDOWN and is NOT meant to be the production profile:
    #   * filesystem confined to the OS + workdir + /tmp
    #   * never root (run_as_user: sandbox)
    #   * Landlock REQUIRED (hard_requirement) — fail if the kernel can't enforce it
    #   * ALL network egress DENIED (empty network_policies => deny-by-default)
    #
    # Under this default the agent cannot reach the MAC hub, the model gateway, or
    # the Hermes runtime under ~/.mac, so an unconfigured deployment FAILS CLOSED
    # (tasks error) rather than running under an unknown or over-permissive profile.
    #
    # To run real networked agents, provide a proper policy: copy
    # deploy/openshell/mac-hermes-policy.yaml, fill in your hub/gateway hosts and the
    # agent's home paths, then either install it at ~/.mac/openshell-policy.yaml or
    # point MAC_OPENSHELL_POLICY at it.

    version: 1

    filesystem_policy:
      include_workdir: true
      read_only:
        - /usr
        - /lib
        - /lib64
        - /bin
        - /sbin
        - /etc
        - /proc
      read_write:
        - /tmp
        # /dev as a directory (not individual device leaves): under hard_requirement
        # on Landlock ABI >= 3 (kernel 6.x), a device FILE given a directory access
        # right (ReadDir) is rejected as "incompatible directory-only access-rights".
        # The /dev directory satisfies ReadDir and covers /dev/null + /dev/urandom;
        # a rootless container's /dev is a minimal safe set (null/zero/urandom/tty).
        - /dev

    landlock:
      # Fail closed: abort if the kernel lacks Landlock (5.13+) or a declared path
      # is unenforceable, rather than running without filesystem confinement.
      compatibility: hard_requirement

    process:
      run_as_user: sandbox
      run_as_group: sandbox

    # Empty => deny-by-default with nothing allowed == ALL network egress denied.
    network_policies: {}
  phase_profile:
    schema: mac.certifier_phase_profile.v1
    version: 1
    checksum: sha256:bf8d69a6981f834f0685135ff0f00f954ffaa2274a61c796ff10300471d23de4
    full_targets:
      - plugin/test_tools.py
      - tests
    focused_required_tests:
      - tests/test_openshell_certifier.py
      - tests/test_publication_lane.py
      - tests/test_repository_contract_certification.py
    selection_modes:
      authoritative_full:
        authoritative:
          mode: full
          reason: source_change_has_no_frozen_test_mapping
        supplemental:
          mode: skipped
          reason: authoritative_full_is_sufficient
        expected_full_suite_count: 1
      candidate_test_focused:
        authoritative:
          mode: focused
          reason: candidate_tests_are_non_authoritative_frozen_invariants
        supplemental:
          mode: skipped
          reason: candidate_tests_are_worker_evidence
        expected_full_suite_count: 0
      documentation_fast_lane:
        authoritative:
          mode: focused
          reason: documentation_only_invariants
        supplemental:
          mode: skipped
          reason: documentation_only
        expected_full_suite_count: 0
      mixed_unmapped_rejected:
        authoritative:
          mode: rejected
          reason: unmapped_source_and_candidate_root_scope_require_two_full_phases
        supplemental:
          mode: skipped
          reason: selection_rejected
        expected_full_suite_count: 0
      source_focused:
        authoritative:
          mode: focused
          reason: mapped_source_and_root_owned_invariants
        supplemental:
          mode: skipped
          reason: no_candidate_root_visible_change
        expected_full_suite_count: 0
      supplemental_full:
        authoritative:
          mode: focused
          reason: root_owned_invariants_and_mapped_source_tests
        supplemental:
          mode: full
          reason: candidate_root_visible_change_requires_supplemental_full
        expected_full_suite_count: 1
  image_ref: ghcr.io/jordanhubbard/mac-certifier@sha256:75f4625c1bd8088ab802ae41b67744e93abc8d3b96bf28f38217031e516170b0
  controller_commands:
    - command_id: contract-tests
      argv:
        - /opt/mac-certifier/bin/run-contract-tests
      timeout_seconds: 3600
platforms:
  - darwin
  - linux
  - wsl2
toolchain:
  required_commands:
    - python3
    - git
    - gh
bootstrap:
  command: python3 scripts/bootstrap-project.py
  creates:
    - .venv/bin/python
    - .venv/bin/pytest
    - .venv/bin/coverage
test:
  command: scripts/run-contract-tests.sh
evidence:
  required:
    - repo.head_sha
    - repo.pushed
    - repo.dirty
    - repo.files_changed
    - tests
