[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mac"
dynamic = ["version"]
description = "Trustworthy coordination layer for a fleet of AI agents."
readme = "README.md"
# Bumped 3.9 -> 3.11 for the vendored Hermes runtime (ADR 0001).
requires-python = ">=3.11"
dependencies = [
    # --- mac control plane ---
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "cryptography>=42,<46",
    "slack-sdk>=3.27,<4.0",
    # --- agent numerical computation (so agents can do more than text/code) ---
    "numpy>=1.26,<3.0",
    # --- vendored Hermes runtime core (ADR 0001; see deploy/hermes/SNAPSHOT.md) ---
    # Exact-pinned per Hermes' supply-chain discipline. The two overlaps with
    # mac (httpx, pyyaml) fell within mac's ranges, so we adopt Hermes' pins.
    "httpx[socks]==0.28.1",
    "pyyaml==6.0.3",
    "openai==2.24.0",
    "pydantic==2.13.4",
    "prompt_toolkit==3.0.52",
    "rich==14.3.3",
    "tenacity==9.1.4",
    "jinja2==3.1.6",
    "requests==2.33.0",
    "fire==0.7.1",
    "croniter==6.0.0",
    "psutil==7.2.2",
    "PyJWT[crypto]==2.12.1",
    "python-dotenv==1.2.2",
    "ruamel.yaml==0.18.17",
    "tzdata==2025.3; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-xdist>=3.0,<4.0",
    "coverage[toml]>=7.10,<8.0",
    "psycopg[binary]>=3.1,<4.0",
    "psycopg_pool>=3.2,<4.0",
    "kubernetes>=30.1,<33",
    # Shared lint/format toolchain; see [tool.ruff] and scripts/run-lint.sh.
    # `make lint` fetches this on demand via `uv run --with ruff`, but pinning
    # it in the dev extra keeps the enforced version consistent across hosts.
    "ruff>=0.16,<0.17",
    # Mirrors the hermes-gateway pin so CI can construct the vendored Slack
    # adapter's AsyncApp against the REAL library. Without it that test skips
    # in CI and a slack_bolt bump breaks the gateway on a host rather than in a
    # build -- which is exactly how 1.27 reached us. Cheap to carry: slack_sdk
    # is already a core dependency. aiohttp is pinned alongside it because
    # slack_bolt's ASYNC app -- the one the gateway actually uses -- imports it
    # at module load, so without it the check would skip rather than run.
    "slack_bolt==1.27.0",
    "aiohttp==3.13.4",
]
docs = [
    "mkdocs-material>=9.7,<10",
    "mike>=2.2,<3",
    "mkdocs-redirects>=1.2,<2",
]
postgres = [
    "psycopg[binary]>=3.1,<4.0",
    "psycopg_pool>=3.2,<4.0",
]
k8s = [
    "kubernetes>=30.1,<33",
]
relay = [
    "nemo-relay==0.3.0",
]
# Platform deps the in-process Hermes gateway needs (hu-03), measured from the
# deployed Hermes venv. Provider-specific backends (anthropic, firecrawl-py,
# exa-py, ...) stay lazy via the vendored tools/lazy_deps.py, not here.
hermes-gateway = [
    "slack_bolt==1.27.0",
    "discord.py==2.7.1",
    "python-telegram-bot==22.6",
    "aiohttp==3.13.4",
]

[project.scripts]
mac = "mac.cli:main"
mac-hermes = "mac.hermes_adapter:main"
mac-agent = "mac.worker:main"
mac-firecrawl-gateway = "mac.firecrawl_gateway:main"
# K8s Phase 4/5 binaries (require the [k8s] optional extra at runtime).
# `mac-k8s-orchestrator` is the long-running dispatcher: it folds the
# previous claim/launch and stuck-Job reconciliation loops into one
# process, served by a single Deployment + ServiceAccount.
mac-k8s-orchestrator = "mac.k8s.orchestrator:main"
mac-k8s-bootstrap = "mac.k8s.bootstrap:main"
mac-task-runner = "mac.k8s.job_executor:main"
mac-webdav-server = "mac.webdav_server:main"
# Standalone LLM router (MAC_ROUTER_BACKEND=standalone): same router as the
# in-hub inproc mount, in its own process so ledger restarts don't drop
# in-flight model streams; also deployable as a per-site replica.
mac-router = "mac.router_service:main"
# Verified authority snapshots for warm-standby recovery. The SQLite-era
# mac-ledger-backup entry point went with its module.
mac-pg-backup = "mac.pg_backup:main"
# Thin CLI shared by host-mode workers and the Job-pod codex stubs to
# sign worker_evidence manifests without re-implementing the canonical
# HMAC in bash heredocs (see deploy/codex-runner/mac-task-executor-*).
mac-evidence = "mac.evidence_cli:main"
mac-hermes-gateway = "mac.hermes_gateway:main"
mac-openshell-supervisor = "mac.openshell_supervisor:main"
mac-openshell-collector = "mac.openshell_collector:main"
# Controller-only GitHub HTTPS credential bridge. The executable reads GH_TOKEN
# from its child environment; no credential is accepted on argv or persisted.
mac-git-askpass = "mac.git_askpass:main"

[tool.pytest.ini_options]
testpaths = ["tests", "plugin"]
pythonpath = ["src"]
markers = [
    "api: FastAPI HTTP endpoint tests (tests/api/)",
    "cli: CLI command tests — mac (tests/cli/)",
    "ui: UI asset-serving and dashboard tests (tests/ui/)",
    "postgres: live-Postgres tests; need MAC_TEST_PG_URL pointing at a writable test DB",
    "process_e2e: black-box tests using real MAC processes and public network/CLI boundaries",
    "container_contract: in-container contract tests; require TEST_CONTAINER_CONTRACT=1 and docker compose",
    "docker_e2e: legacy alias for container-contract selection during migration",
    "fleet: fleet lifecycle/rollback/quiesce clusters (test_fleet_*, test_deploy_fleet_*)",
    "work_package: work-package pipeline tests (test_work_package*)",
    "worker: worker executor/credential tests (test_worker*)",
    "heavy_e2e: slow real-subprocess/e2e clusters (*_e2e.py, documentation book)",
]

[tool.coverage.run]
source = ["src/mac"]
branch = true
relative_files = true
# Coverage.py 7.10+ propagates measurement into Python child processes and
# automatically writes parallel data files for later `coverage combine`.
patch = ["subprocess"]
omit = [
    # Pinned upstream snapshot; keep mac-owned adapters covered here, but do
    # not count vendored Hermes internals against this repository's threshold.
    "src/mac/_hermes/*",
]

[tool.coverage.report]
# Separate statement and branch safety floors live in test-policy.toml and are
# enforced by scripts/coverage-policy.py. The built-in aggregate percentage
# mixes statements and branches, so it must not become a coverage-maximization
# KPI or hide weak decision coverage behind a high statement percentage.
fail_under = 0
precision = 2
show_missing = true
skip_covered = true

[tool.hatch.version]
path = "src/mac/__init__.py"

[tool.hatch.build.targets.wheel]
# packages already sweeps in all of src/mac, including the src/mac/ui static
# assets — a force-include of src/mac/ui would double-add them and fail the
# build ("a second file ... at the same path").
packages = ["src/mac"]

# --- Shared lint / format configuration --------------------------------------
# One Ruff configuration is the single source of truth for linting and
# formatting across the mac control plane. It is wired to `make lint`
# (check-only, the CI/pre-push contract) and `make lint-fix` (apply safe
# autofixes locally) via scripts/run-lint.sh, so every developer and every host
# runs byte-identical rules instead of ad-hoc per-directory settings.
[tool.ruff]
# Match the project's minimum supported interpreter (ADR 0001).
target-version = "py311"
line-length = 100
# The vendored Hermes runtime keeps its own upstream lint discipline (see
# deploy/hermes/SNAPSHOT.md); do not relint it here. The generated vulture
# allowlist intentionally references undefined names for the dead-code gate.
extend-exclude = [
    "src/mac/_hermes",
    "scripts/vulture_allowlist.py",
    ".venv",
    "dist",
]

[tool.ruff.lint]
# Start from the always-green correctness floor so `make lint` is enforceable
# from day one on every host: pyflakes logic errors / undefined names
# (F63, F7, F82) and syntax errors (E9). Broaden this set as the codebase is
# cleaned up (F401, I, UP, B, ...) — widen the select list, not the tool.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
# Match Ruff's Black-compatible defaults so `ruff format` is deterministic and
# reviewable; `make lint` only checks formatting, `make lint-fix` applies it.
docstring-code-format = false
