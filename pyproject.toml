[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mac"
version = "0.1.0"
description = "Trustworthy coordination layer for a fleet of AI agents."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "cryptography>=42,<46",
    "PyYAML>=6.0,<7.0",
    "slack-sdk>=3.27,<4.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "psycopg[binary]>=3.1,<4.0",
    "psycopg_pool>=3.2,<4.0",
    "kubernetes>=30.1,<33",
]
postgres = [
    "psycopg[binary]>=3.1,<4.0",
    "psycopg_pool>=3.2,<4.0",
]
k8s = [
    "kubernetes>=30.1,<33",
]

[project.scripts]
mac = "mac.cli:main"
mac-hermes = "mac.hermes_adapter:main"
mac-agent = "mac.worker:main"
mac-firecrawl-gateway = "mac.firecrawl_gateway:main"
# K8s Phase 4/5 binaries (require the [k8s] optional extra at runtime).
# `mac-k8s-orchestrator` is the long-running dispatcher: it folds the
# former mac-k8s-runner (claim+launch loop) and mac-k8s-controller
# (stuck-Job + provisioning reconciler) into one process with two
# loops, served by a single Deployment + ServiceAccount.
mac-k8s-orchestrator = "mac.k8s.orchestrator:main"
mac-k8s-bootstrap = "mac.k8s.bootstrap:main"
mac-task-runner = "mac.k8s.job_executor:main"
# Thin CLI shared by host-mode workers and the Job-pod codex stubs to
# sign worker_evidence manifests without re-implementing the canonical
# HMAC in bash heredocs (see deploy/codex-runner/mac-task-executor-*).
mac-evidence = "mac.evidence_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "api: FastAPI HTTP endpoint tests (tests/api/)",
    "cli: CLI command tests — mac (tests/cli/)",
    "ui: UI asset-serving and dashboard tests (tests/ui/)",
    "postgres: live-Postgres tests; need MAC_TEST_PG_URL pointing at a writable test DB",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mac"]

[tool.hatch.build.targets.wheel.force-include]
"src/mac/ui" = "mac/ui"
