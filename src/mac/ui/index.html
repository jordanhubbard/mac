<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MAC Control Plane</title>
    <link rel="stylesheet" href="/ui/assets/styles.css">
  </head>
  <body>
    <div id="loginScreen" class="login-screen" hidden>
      <div class="login-card">
        <div class="brand">
          <span class="brand-mark">mac</span>
          <span class="brand-name">Control Plane</span>
        </div>
        <div>
          <h2>Sign in</h2>
          <p class="muted">Enter your API token to access the dashboard.</p>
        </div>
        <form id="loginForm" class="login-form">
          <label for="loginTokenInput">API Token</label>
          <input id="loginTokenInput" name="token" type="password" autocomplete="off" placeholder="Paste your bearer token" required>
          <button type="submit" class="primary-button">Sign in</button>
        </form>
      </div>
    </div>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary">
        <div class="brand">
          <span class="brand-mark">mac</span>
          <span class="brand-name">Control Plane</span>
        </div>
        <nav class="nav" id="viewNav" aria-label="Dashboard views">
          <div class="nav-section">
            <span class="nav-section-label">Home</span>
            <button class="nav-item is-active" type="button" data-view="overview" aria-current="page">Overview</button>
          </div>
          <div class="nav-section">
            <span class="nav-section-label">Work</span>
            <button class="nav-item" type="button" data-view="work">Work</button>
            <button class="nav-item" type="button" data-view="projects">Projects</button>
            <button class="nav-item" type="button" data-view="tasks">Tasks</button>
            <button class="nav-item" type="button" data-view="workflows">Workflows</button>
          </div>
          <div class="nav-section">
            <span class="nav-section-label">Fleet</span>
            <button class="nav-item" type="button" data-view="map">Map</button>
            <button class="nav-item" type="button" data-view="fleets">Fleets</button>
            <button class="nav-item" type="button" data-view="agents">Agents</button>
          </div>
          <div class="nav-section">
            <span class="nav-section-label">Operations</span>
            <button class="nav-item" type="button" data-view="hermes">Hermes</button>
            <button class="nav-item" type="button" data-view="ops">Operations</button>
            <button class="nav-item" type="button" data-view="integrations">Integrations</button>
            <button class="nav-item" type="button" data-view="runtime">Runtime</button>
            <button class="nav-item" type="button" data-view="observability">Observability</button>
          </div>
          <div class="nav-section">
            <span class="nav-section-label">Security</span>
            <button class="nav-item" type="button" data-view="secrets">Secrets</button>
          </div>
        </nav>
        <div id="serviceLinks" class="service-links" hidden></div>
        <form class="token-form" id="tokenForm">
          <label for="tokenInput">API Token</label>
          <input id="tokenInput" name="token" type="password" autocomplete="off" placeholder="Bearer token">
          <div class="token-actions">
            <button type="submit">Use</button>
            <button type="button" id="clearTokenButton">Clear</button>
          </div>
        </form>
      </aside>
      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">MAC</p>
            <h1 id="viewTitle">Overview</h1>
          </div>
          <div class="topbar-actions">
            <span class="sync-state" id="syncState">Not loaded</span>
            <button class="primary-button" type="button" id="refreshButton">Refresh</button>
          </div>
        </header>
        <section id="banner" class="banner" hidden></section>
        <section id="content" class="content" aria-live="polite"></section>
      </main>
    </div>
    <!-- app.ts is the maintained source; app.js is checked-in browser output. -->
    <script type="module" src="/ui/assets/app.js?v=20260527-agent-fleets"></script>
  </body>
</html>
