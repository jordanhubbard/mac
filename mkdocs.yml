site_name: MAC Documentation
site_description: Production handbook for operating trustworthy fleets of AI agents.
site_url: https://jordanhubbard.github.io/mac/
repo_url: https://github.com/jordanhubbard/mac
repo_name: jordanhubbard/mac
edit_uri: edit/main/docs/
copyright: Copyright the MAC contributors. Documentation is versioned with the software.
strict: true

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Use light mode

plugins:
  - search
  - redirects:
      redirect_maps:
        assessment-task-1b6783.md: archive/field-notes/assessment-task-1b6783.md
        assessment-task-7023d6.md: archive/field-notes/assessment-task-7023d6.md
