  - mike:
      alias_type: redirect
      canonical_version: !ENV [DOCS_CANONICAL_VERSION, dev]
      version_selector: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  version:
    provider: mike
  generator: false

extra_css:
  - stylesheets/extra.css

