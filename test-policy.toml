schema = "mac.test_policy.v1"

[coverage]
# Safety rails, not optimization targets. Changes to these values require a
# portfolio report and behavioral/fault-detection justification.
statement_safety_floor = 90.0
branch_safety_floor = 80.0
require_branch_measurement = true

[coverage.diff]
# When the gate runs a resolver-selected SUBSET (impact-based selection), the
# whole-repo floors above are not measurable. Diff-coverage enforces the same
# safety intent over ONLY the lines the change touched, so an untested changed
# line fails the gate even though the whole-repo total is unmeasured. The
# scheduled full run re-enforces the whole-repo [coverage] floors and rebuilds
# the impact map, so this is a complement, never a replacement.
statement_safety_floor = 90.0
branch_safety_floor = 80.0

[portfolio]
protect_historical_fault_probes = true
candidate_requires_zero_unique_lines = true
candidate_requires_zero_unique_arcs = true

[selection]
# Impact-based test selection (scripts/resolve-impacted-tests.py). A test is
# selected only when the code it actually exercises changed. The engine uses
# the dynamic per-test coverage map and falls back to the full suite whenever a
# changed file cannot be safely mapped.
#
# Committed map produced post-merge on main by scripts/build-test-impact-map.py.
# A missing or stale map is always SAFE: every unresolved source file forces a
# full run, which is the pre-selection behavior.
impact_map = "src/mac/data/test_impact_map.json"

# Files that invalidate the whole map or test collection when they change, so a
# change to any of them forces a full run regardless of the map. Kept minimal
# on purpose: the old selector escalated on every scripts/ and pyproject edit,
# which is exactly the over-escalation impact selection removes.
#
# The last four are the SELECTOR ITSELF. `test-policy.toml` was already here;
# the code it configures was not, so a change to the selection machinery got a
# scope chosen by the changed machinery. Observed on #408 (run 32104798882),
# which modified two of these files:
#
#     sanity selection: focused (impact_hybrid_scope)
#     collected 750 items
#     746 passed, 4 skipped in 68.70s
#
# 750 of ~11,400 tests, in 1m44s. The change was correct, but
# `tests/test_select_sanity_tests.py` -- the file whose failures prompted that
# very fix -- was selected ZERO times, so the run could not have contradicted
# it. A component that decides what gets verified must not be allowed to narrow
# its own verification.
global_full_paths = [
    "conftest.py",
    "tests/conftest.py",
    "test-policy.toml",
    "uv.lock",
    "poetry.lock",
    "scripts/select-sanity-tests.py",
    "scripts/resolve-impacted-tests.py",
    "scripts/build-test-impact-map.py",
    "src/mac/test_checkpoint.py",
]

# Cross-cutting guards that can never be safely deselected by the dynamic layer
# (their real coverage is unattributed subprocess/session work, or they are
# public-contract canaries). The builder also seeds unattributed test files into
# the map's own always_run list; these are additive belt-and-braces.
always_run = [
    "tests/test_control_plane_public_contract.py",
    "tests/api/test_task_read_endpoints.py",
    "tests/cli/test_cli_coverage_gate.py",
    "tests/ui/test_fleet_ide_api_contracts.py",
    "tests/test_worker_process_e2e.py",
    # Generated-artifact consistency. These cannot be reached by impact
    # selection, because the thing that invalidates them is not a code path
    # they cover: adding MAC_DEPLOY_CONTAINER_RUNTIME_PATHS to a SHELL script
    # (#291) staled a registry generated by scanning the tree, and nothing
    # linked that shell file to test_env_config.py. Renaming a test (#292)
    # staled the impact map the same way.
    #
    # Their failure mode is the expensive one: invisible on the pull request,
    # red on main. main was red across three consecutive commits on 2026-08-07
    # for exactly this, every one of those PRs having been green. 47 tests,
    # ~10s -- cheap enough to pay on every focused run rather than discovering
    # it after the merge.
    "tests/test_env_config.py",
    # Same category: what invalidates it (a Makefile target, a vite outDir, an
    # api.py route) is not a code path it covers, and its failure mode is the
    # one that produced ADR 0025 -- `make run-gui` serving a UI no hub mounts,
    # green everywhere, visible only by curling a live hub.
    "tests/ui/test_hub_ui_is_one_tree.py",
    "tests/test_build_test_impact_map.py",
    "tests/test_resolve_impacted_tests.py",
]
